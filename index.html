<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topaz Starlight upscale: before and after</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#eee;font:15px/1.4 system-ui,sans-serif}
header{padding:16px;text-align:center}h1{font-size:18px;margin:0 0 4px}p{margin:0;color:#aaa;font-size:13px}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}
button{min-height:44px;padding:0 16px;border:1px solid #555;background:#1a1a1c;color:#eee;border-radius:8px;font-size:14px}
button.on{background:#c9a24a;color:#111;border-color:#c9a24a}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;max-width:1400px;margin:auto}
.cell{position:relative;overflow:hidden;background:#000;aspect-ratio:var(--ar,612/720)}
.cell video{width:100%;height:100%;display:block;object-fit:contain}
.lab{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;font-size:12px;z-index:3}
.wipe{position:relative;max-width:var(--mw,720px);margin:8px auto;aspect-ratio:var(--ar,612/720);overflow:hidden;background:#000;touch-action:none;cursor:ew-resize}
.wipe video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.wipe .top{clip-path:inset(0 0 0 50%)}
.bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#c9a24a;z-index:2}
.bar:after{content:"⇆";position:absolute;top:50%;left:-21px;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#c9a24a;color:#111;display:grid;place-items:center;font-size:20px}
.lab.r{left:auto;right:8px}
body.zoom .cell video,body.zoom .wipe video{transform:scale(3);transform-origin:var(--ox,50%) var(--oy,35%)}
.hide{display:none}
footer{padding:16px;text-align:center;color:#888;font-size:12px}
@media(max-width:600px){.side{grid-template-columns:1fr}}
body.wide .side{grid-template-columns:1fr}
</style></head><body>
<header><h1 id="ttl"></h1>
<p id="sub"></p></header>
<div class="ctl"><button id="cT">Truheart hero (Roman on stage)</button><button id="cS">Stirling hero</button></div>
<div class="ctl">
<button id="bSide" class="on">Side by side</button><button id="bWipe">Wipe slider</button>
<button id="bZoom">Zoom 3× (detail)</button><button id="bPause">Pause</button></div>
<p id="zhint" class="hide" style="text-align:center">Zoomed: tap/click the video to move the zoom point.</p>
<section id="side" class="side">
<div class="cell"><span class="lab">Original</span><video src="truheart-original.mp4" muted loop playsinline autoplay preload="auto"></video></div>
<div class="cell"><span class="lab">Topaz Starlight upscale</span><video src="truheart-topaz.mp4" muted loop playsinline autoplay preload="auto"></video></div>
</section>
<section id="wipe" class="wipe hide">
<span class="lab">Original</span><span class="lab r">Topaz Starlight upscale</span>
<video src="truheart-original.mp4" muted loop playsinline preload="auto"></video>
<video class="top" src="truheart-topaz.mp4" muted loop playsinline preload="auto"></video>
<div class="bar"></div></section>
<footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s),V=[...document.querySelectorAll('video')];
let mode='side',paused=false;
const act=()=>V.filter(v=>v.closest('section:not(.hide)'));
function sync(){const a=act();if(a.length<2)return;const m=a[0];a.slice(1).forEach(v=>{if(Math.abs(v.currentTime-m.currentTime)>0.06)v.currentTime=m.currentTime;});}
setInterval(sync,500);
function setMode(m){mode=m;$('#side').classList.toggle('hide',m!=='side');$('#wipe').classList.toggle('hide',m!=='wipe');
$('#bSide').classList.toggle('on',m==='side');$('#bWipe').classList.toggle('on',m==='wipe');
V.forEach(v=>{if(v.closest('.hide'))v.pause();});const a=act();const t=a[0].currentTime;a.forEach(v=>{v.currentTime=t;if(!paused)v.play().catch(()=>{});});}
$('#bSide').onclick=()=>setMode('side');$('#bWipe').onclick=()=>setMode('wipe');
$('#bZoom').onclick=e=>{const z=document.body.classList.toggle('zoom');e.target.classList.toggle('on',z);$('#zhint').classList.toggle('hide',!z);};
$('#bPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';act().forEach(v=>paused?v.pause():v.play());sync();};
document.querySelectorAll('.cell,.wipe').forEach(el=>el.addEventListener('click',e=>{if(!document.body.classList.contains('zoom')||mode==='wipe')return;const r=el.getBoundingClientRect();
document.body.style.setProperty('--ox',((e.clientX-r.left)/r.width*100)+'%');document.body.style.setProperty('--oy',((e.clientY-r.top)/r.height*100)+'%');}));
const w=$('#wipe'),tv=w.querySelector('.top'),bar=w.querySelector('.bar');let drag=false;
function setX(x){const r=w.getBoundingClientRect();let p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));tv.style.clipPath=`inset(0 0 0 ${p}%)`;bar.style.left=p+'%';}
w.addEventListener('pointerdown',e=>{drag=true;w.setPointerCapture(e.pointerId);setX(e.clientX);});
w.addEventListener('pointermove',e=>{if(drag)setX(e.clientX);});w.addEventListener('pointerup',()=>drag=false);
const C={truheart:{t:'Truheart hero (Roman on stage): Original vs Topaz Starlight upscale',s:'Original 612×720 · Topaz Starlight Precise 2.6 → 2160×2540 (shown here as a 1224×1440 web encode). Both are shown at the same display size.',o:'truheart-original.mp4',u:'truheart-topaz.mp4',ar:'612/720',mw:'720px',f:'Original: the pre-Topaz stage.mp4 from the Truheart concept. Upscale: Topaz for Web, Starlight Precise 2.6. No color or overlay changes.'},
stirling:{t:'Stirling hero: Original vs Topaz Starlight upscale',s:'Original 1920×1080 · Topaz Starlight Precise 2.6 → 3840×2160 (shown here as a 2560×1440 web encode). Both are shown at the same display size.',o:'stirling-original.mp4',u:'stirling-topaz.mp4',ar:'16/9',mw:'1400px',f:'Original: film/opening.mp4 from the live Stirling concept (unchanged). Upscale: Topaz for Web, Starlight Precise 2.6. No color or overlay changes.'}};
function setClip(k){const c=C[k];document.title=c.t;$('#ttl').textContent=c.t;$('#sub').textContent=c.s;$('#ft').textContent=c.f;
document.body.style.setProperty('--ar',c.ar);document.body.style.setProperty('--mw',c.mw);document.body.classList.toggle('wide',k==='stirling');
$('#cT').classList.toggle('on',k==='truheart');$('#cS').classList.toggle('on',k==='stirling');
document.querySelectorAll('section').forEach(sec=>{const vs=sec.querySelectorAll('video');vs[0].src=c.o;vs[1].src=c.u;});
history.replaceState(null,'','?clip='+k+location.hash);setMode(mode);}
$('#cT').onclick=()=>setClip('truheart');$('#cS').onclick=()=>setClip('stirling');
setClip(new URLSearchParams(location.search).get('clip')==='stirling'?'stirling':'truheart');
</script></body></html>
